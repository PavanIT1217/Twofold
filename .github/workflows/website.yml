name: Website

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml", ".github/scripts/check_website.py"]
  pull_request:
    paths: ["website/**", ".github/workflows/website.yml", ".github/scripts/check_website.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check titles, descriptions, structured data, links and sitemap
        run: python3 .github/scripts/check_website.py website

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
